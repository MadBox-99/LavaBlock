[item-description]
pug-mill=Mixes crushed rock with water and presses it into brick moulds. The bricks come out wet and dry on their own.
fermentation-tank=A closed, cooled vessel where biomass and water ferment into wash.
island-link-pole=Reaches 64 tiles, the longest wire there is, to carry power from island to island. Takes two wires only - one in, one out.
fuel-plant=Hydrates petroleum gas into ethanol, and charges ethanol with oxygen into rocket fuel.
distillation-column=Boils fermented wash with steam from the reboiler; ethanol leaves the top of the tower and water the bottom.
straw=Cut and dried grass, for mixing into adobe.
wet-adobe-brick=Dries into a stone brick in two minutes, wherever it is standing.
quench-pit=Destroys any fluid at 1200 per second - one pump's worth. Costs power and pollutes heavily while it runs.
air-filter=An electrostatic precipitator. Charges the tower against the air passing up through it, and the dust drops out. The air compressor used to do this as well as compressing and separating; now it only compresses and separates.
gas-combiner=Two receivers, a mixing drum and a blower. Meters two gases together in a fixed ratio and sends out the blend.
crystallizer=A hexagonal hearth holding a pan of melt just below the temperature rock freezes at, with a rabble turning slowly through it. Crystal grows on the shelf around the rim.
silica-crystal=Grown out of a melt over several seconds rather than frozen out of it in one. Remelt it fast and it cannot crystallise again: that is glass.
glass=Cast sheet. The island's only transparent material, and what every growing building here is walled with.
glazed-panel=A pane in a steel frame. Wall panel for the glasshouses - the arboretum, the algae tank and the bio garden's dome.
burner-roll-crusher=Two toothed rolls turning towards each other, with the rock going down the gap between them. Burns fuel, so it needs no power line - which is the point, because the island wants stone long before it has a grid.
roll-crusher=Two toothed rolls turning towards each other, with the rock going down the gap between them. Twice the burner's speed, and it takes modules.
industrial-roll-crusher=The heavy roll crusher. Faster again, four module slots, and a lubricant line that unlocks a recipe getting half again as much stone out of the same basalt.
basalt=Lava quenched into rock. Worth nothing until it is crushed.
basalt-gravel=Basalt off the first pass through a crusher. One more grind and it is stone.
crusher-roll=A toothed drum. Two of them facing each other are what a roll crusher crushes with.
culture-column=A glazed column with a steel frame. What algae is grown in, and what the tank is four of.
grow-lamp=A magenta tube under a reflector. Plants and algae grow under these, because there is no sun worth having here.
condenser-coil=A finned copper tube. Pulls the heat out of steam so it can fall back to water.
bio-garden=A glass dome over a thickener and a press. Squeezes the algae harvest for what it grew on - fibre, nitrogen or carbonate - and absorbs pollution while it runs, about as much as seventeen trees on an island that has none.
algae-tank=A sealed photobioreactor. Four culture columns behind glass, growing green, blue or red algae depending on what you feed the second pipe.
algae-green=Grown on water thick with dissolved rock. Builds fibre, which presses into usable timber.
algae-blue=Grown on water and air. Fixes nitrogen straight out of the atmosphere.
algae-red=Grown on water and steam. Lays down calcium carbonate as it grows.
arboretum=A 5x5 glasshouse under grow lamps and a rotating irrigation boom. Grows wood from tree seeds and water, and can make its own seeds from wood.
water-condenser=Air-cooled steam condenser. Turns steam back into water at 2 to 1, where a chemical plant manages barely a tenth of that.
industrialised-chemical-plant=A whole refinery on one 3x3 skid. Twice the crafting speed of a chemical plant, on the same chemistry recipes. Its sight glasses show the colour of whatever it is making.
uranium-bacteria=Bacteria that metabolizes bioflux into uranium ore. Spoils into uranium ore.
lava-mech-armor=A basic mech armor with minimal protection. Perfect for surviving the harsh lava environment.
xp-science-pack=Crystallized experience from crafting. Used in the XP Lab.
xp-lab=A specialized lab that only accepts XP Science Packs for quest research.
military-science-pack-2=Advanced military research pack utilizing cutting-edge weaponry and electromagnetic technology.
circuit-science-pack=Science pack focused on electronic circuit research and productivity improvements.
lava-slag=The dross skimmed off standing lava. Grown with sulfur and coal it gives crystal; leached with water it gives up its calcium.
pyrite=Iron sulfide, grown in cubes. The commonest crystal the hearth gives.
magnetite=Iron oxide, grown out of molten iron with slag stirred through it. Magnetic: it holds the melt in magma cells and the magma reactor, and turns the magma turbine's generator.
olivine=The green silicate most slag is made of. It takes the heat without melting, so it lines the magma reactor and magma cells; crush the surplus to gravel.
ruby=Corundum reddened by chromium. One craft in five grows one.
sapphire=Corundum coloured by iron and titanium. One craft in five grows one.
diamond=Carbon from the coal. One craft in twenty grows one. The laser cutter takes one to carry the heat off its ruby rod.
crystal-circuit-board=A circuit laid on sapphire, with pyrite contacts and a ruby at its heart. Drives the laser cutter, and carries the sapphire processing unit.
limestone=Made, not mined: calcium out of slag, set with carbon dioxide.
quicklime=Limestone fired until its carbon dioxide is gone. Add water.
slaked-lime=Quicklime after water, fallen to powder. The binder in lime mortar.
lime-mortar=Slaked lime and gravel, mixed in the pug mill. Cast into concrete.
quartz-lens=Cast from molten quartz. Fused quartz passes a laser's light without soaking it up and cracking, which glass does not.
silicon-wafer=A slice off a silica crystal. Solar cells are made of these.
sapphire-substrate=Sapphire cut into thin plates, for chips built on crystal rather than on silicon alone.
magma-cell=A magnetite coil holding a charge of melt in an olivine lining, with pyrite to light it. Magma reactor fuel: 40 GJ, forty seconds in a working reactor.
magma-reactor=Burns magma cells and draws 100 MW to drive cold molten salt up into plasma - 1000 MW of it, enough for four magma turbines, one on each plasma nozzle. Reactors built side by side run hotter.
magma-turbine=Fifteen tiles of turbine and generator. Turns magma plasma into 250 MW and hot molten salt, which has to be cooled before the reactor takes it back. Plasma only passes straight in from a reactor or another turbine, never through a pipe.
cassiterite=Tin oxide, grown out of slag with chlorine blown through it. Smelt it for tin.
tin-plate=Fired into the lithography machine's laser as droplets, one plate a print, and built into the nozzle of every laser source. With copper it makes bronze, and with lead solder.
laser-source=A ruby laser and a tin droplet nozzle in one housing: the lithography machine's light source. It wears out - each print has a one in fifty chance of burning it up.
lithography-machine=Prints silicon wafers into microchips with the light of tin plasma. Takes a laser source, which wears out, and tin with every print. Draws 5 MW.
microchip=Chips printed on a silicon wafer. They stand in for advanced circuits in processing units, and every tier 3 module takes two.
train-factory=An erecting shop and an open assembly bay, where welding robots build locomotives and wagons on a length of track. The only place on the island rolling stock can be built. Takes lava for its foundry.
coil-winder=Turns a coil on a turntable while a guide carriage lays copper wire onto it, layer by layer. The only machine that makes magnetic coils. Draws 200 kW.
ferrite-magnet=A permanent magnet of sintered iron oxide, pressed from magnetite with limestone in place of the strontium the island lacks. Half of every electric motor and generator.
magnetic-coil=Copper wire wound on a soft iron core. The other half of every electric motor and generator, and two to a transformer.
transformer=Two coils on a steel core, sealed in a tank of oil. Every substation stands on one.
arc-furnace=Three graphite electrodes lowered into a water-cooled shell. Smelts alloys and the metals won by electricity, and steel faster than any furnace. Draws 3 MW.
isostatic-press=A furnace inside a pressure vessel, held shut by a wire-wound yoke and charged with argon by its own compressor. Sinters tungsten carbide and cobalt into cemented carbide. Built on Vulcanus. Draws 3 MW.
eddy-current-separator=Runs scrap over a spinning magnet rotor, which throws the non-ferrous metal into one bin and lets the rest fall into another. Built on Fulgora. Draws 500 kW.
bioleaching-reactor=Two stirred tanks of acid-loving bacteria that leach metal out of sulfide ore and slag, one culture of leaching bacteria a run. Built on Gleba. Draws 300 kW.
cell-assembly-line=Coats cathodes, winds them into cells, fills them with electrolyte and charges them for the first time. Built on Aquilo. Draws 2 MW.
galena=Lead sulfide, grown out of slag and sulfur on the crystal hearth. Smelt it for lead.
sphalerite=Zinc sulfide, grown out of slag, sulfur and steam on the crystal hearth. Smelt it for zinc.
lead-plate=Cast from molten lead. The plate of every lead-acid battery, one to a battery.
zinc-plate=Cast from molten zinc. Brass takes three to every seven molten copper.
pentlandite=Iron-nickel sulfide, grown out of slag, sulfur and molten iron on the crystal hearth. Smelt it for nickel.
chromite=Iron chromium oxide, grown out of slag and oxygen on the crystal hearth. Smelt it for chromium.
manganese-plate=Cast from molten manganese. A tenth of manganese steel.
nichrome-wire=Nickel-chromium wire that glows red-hot for years without burning through. Every electric furnace is wound with ten.
solder=Tin and lead, three to two, cast in bars. One to every processing unit, and one to every pair from the alternative recipes.
alumina=Aluminium oxide, leached out of crushed basalt with caustic soda. Two make an aluminium plate.
magnesium-plate=Cast from molten magnesium. One to every ten duralumin.
stainless-steel-plate=Steel with chromium and nickel in it, which does not rust in steam. Heat exchangers and nuclear reactors are built of it.
manganese-steel-plate=Hadfield steel, which gets harder the harder it is hit. Tank armour and tracks are cast of it.
brass-plate=Seven parts copper to three of zinc. Every cannon shell is cased in two.
bronze-plate=Nine parts copper to one of tin. Express belts, splitters and undergrounds run on it, half a plate for every gear they used to take.
duralumin-plate=Aluminium with a tenth each of copper and magnesium. Every low density structure takes ten in place of twenty copper plates.
borax=Sodium borate, crystallised out of brine. Two and a magnesium plate make two boron.
boron=A brown-black powder that swallows neutrons. A nuclear reactor takes 100 for its control rods.
ilmenite=Iron titanium oxide, grown out of slag and coal on the crystal hearth. Chlorinate it for titanium.
aluminium-plate=Cast from molten aluminium. Titanium alloy, the superalloys and vanadium smelting take it as plate.
vanadium-plate=Reduced out of magnetite with aluminium. One to every ten titanium alloy.
titanium-alloy-plate=Ti-6Al-4V: as strong as steel at a little over half the weight. Exoskeletons are framed in twenty, and Mk2 power armour plated in twenty.
monazite=A rare-earth phosphate, thrown out of purified lava by the lava centrifuge. Crack it in acid for cerium, neodymium, yttrium and phosphorus.
cerium=Cerium, as its pale yellow oxide. One polishes two quartz lenses.
neodymium=Neodymium, as its lavender oxide. Two, five iron, a boron and a nickel plate make four neodymium magnets.
yttrium=Yttrium, as its white oxide, one monazite crack in two. One goes into every ten superalloy.
phosphorus=Red phosphorus. One dopes every fifteen silicon wafers, and one goes into every four fertiliser.
nickel-plate=Cast from molten nickel. The plating on every neodymium magnet.
neodymium-magnet=Neodymium, iron and boron, nickel-plated: ten times a ferrite magnet's pull. Mk2 power armour takes twenty.
cobalt-plate=Leached out of pentlandite with sulfuric acid, with two nickel plates. One to every ten superalloy.
superalloy-plate=Nickel with chromium, cobalt, aluminium and a trace of yttrium. Keeps its strength where steel goes soft; every thruster takes ten.
anode-slime=What does not dissolve when copper is refined: one for every ten plates. Ten part into four silver, two gold and a platinum one time in two.
silver-plate=The best conductor there is. A wafer solar panel's cells are lined with one.
gold-plate=It never tarnishes, so chips are joined to their pins with it. One goes into every microchip print.
platinum-plate=Nothing attacks it, and gases react on it without using it up. Burns ammonia to nitric acid, and wears out one burn in fifty.
potash=Potassium chloride, crystallised out of brine. One goes into every four fertiliser.
fertilizer=Nitrogen, phosphorus and potassium in a granule. Four more wood from a tree, three more green algae from a tank.
calcium-carbide=Quicklime and coal fused in the arc furnace. In water it gives 30 acetylene and leaves a slaked lime.
cemented-carbide=Tungsten carbide bound in cobalt, so that it takes a blow without shattering. A big mining drill takes 20 for its bits.
e-waste=Shredded circuit boards, left over from separating scrap. Smelted in the arc furnace: five copper and two anode slime from ten - twenty times the anode slime that refining copper gives.
leaching-bacteria=Bacteria that live on sulfur and iron, eating a sulfide ore away from the metal in it. The bioleaching reactor uses one a run. Spoils in 20 minutes - long enough to ship off Gleba, not long enough to store.
nmc-cathode=Aluminium foil coated with lithium nickel manganese cobalt oxide. Two make two lithium-ion cells.
lithium-ion-cell=A wound cell of NMC cathode and graphite anode in electrolyte. Two take the place of five lead-acid batteries in an accumulator, and one of two in a flying robot frame.

