[fluid-description]
volcanic-gas=Gas drawn off standing lava: mostly steam, with a few per cent of sulfur dioxide and hydrogen sulfide. The oil refinery splits it.
sulfur-dioxide=One of the two sulfur gases in volcanic gas. Burnt against hydrogen sulfide it becomes molten sulfur, and with oxygen it becomes sulfuric acid, ten for ten.
hydrogen-sulfide=The other sulfur gas in volcanic gas. The Claus process burns two parts of it against one of sulfur dioxide down to molten sulfur.
molten-sulfur=Liquid sulfur from the Claus process. Ten make one sulfur, and twenty bind five gravel into ten concrete.
brine=Salt water leached out of basalt gravel with steam - the island's geothermal brine. The chlor-alkali cell splits it into chlorine, hydrogen and sodium hydroxide.
hydrogen=The lightest gas, from the chlor-alkali cell. Burnt one for one with chlorine it makes hydrochloric acid.
sodium-hydroxide=Caustic soda, the third product of the chlor-alkali cell. Poured into ferric chloride it drops the iron as magnetite and leaves brine behind.
hydrochloric-acid=Hydrogen burnt in chlorine and taken up in water. It dissolves iron into ferric chloride.
ferric-chloride=Iron dissolved in hydrochloric acid and chlorine, twenty units to a plate. It etches circuit boards, and with sodium hydroxide it precipitates magnetite.
molten-glass=Silica fluxed with quicklime and melted, the glass of windows and bottles. Twenty-five pour into a glass, a quarter less silica than the furnace takes.
molten-tin=Tin reduced out of cassiterite with coal. Ten cast a plate, and a bath of it is what float glass cools on.
molten-steel=Molten iron with its carbon burnt out by oxygen. Twenty-five cast a steel plate - the same iron as the furnace takes, without the furnace.
molten-silicon=Silicon reduced out of silica crystal with coal. The crystal hearth pulls it into wafers under argon, three to a crystal.
methane=Biogas from straw or algae digested with no air. Reformed with steam it gives three hydrogen to one carbon monoxide.
carbon-monoxide=The other half of reformed methane. With twice its volume of hydrogen the Fuel Plant builds it into light oil.
nitrogen=Nitrogen gas, sieved out of compressed air. An electric arc forces it together with oxygen into nitric acid.
nitric-acid=Nitrogen and oxygen burnt together in an arc and washed into water. With sulfuric acid it nitrates coal into explosives.
ethylene=Ethanol with the water taken back out. With hydrochloric acid it makes PVC, the same plastic bar the oil line makes.
neon=A rare gas pulled out of air, 5 from 1000. One part in ten of the helium-neon a gas laser source is filled with.
hydrofluoric-acid=Hydrogen fluoride washed out of volcanic gas with water. It fluorinates uranium ore into a gas the centrifuge can spin.
lithium-electrolyte=Lithium hexafluorophosphate in carbonate solvent, made cold in the cryogenic plant from lithium, phosphorus and fluorine. Ten fill two lithium-ion cells.
uranium-hexafluoride=Uranium as a gas, ten ore to fifty. The lava centrifuge spins one U-235 out of a hundred runs, where the vanilla centrifuge gets one in about 140.
molten-lead=Lead smelted out of galena, at 340 degrees. Ten cast a plate; solder takes it as it is.
molten-zinc=Zinc smelted out of sphalerite. Ten cast a zinc plate.
molten-nickel=Nickel smelted out of pentlandite. Stainless steel and nichrome take it as it comes off the tap.
molten-chromium=Chromium smelted out of chromite at 1900 degrees. Stainless steel and nichrome take it as it comes off the tap.
molten-manganese=Manganese reduced out of slag. Ten cast a manganese plate.
molten-aluminium=Aluminium tapped from the reduction cell. Duralumin takes it as it comes off the tap.
molten-magnesium=Magnesium won from brine. Ten cast a magnesium plate.
molten-brass=Copper and zinc, seven to three. Ten cast a brass plate.
molten-bronze=Copper with a tenth of tin. Ten cast a bronze plate.
molten-solder=Tin and lead, three to two. Ten cast a bar of solder.
molten-stainless-steel=Steel with chromium and nickel run into it. Ten cast a stainless steel plate.
molten-manganese-steel=Steel with a tenth of manganese. Ten cast a manganese steel plate.
molten-nichrome=Nickel and chromium, four to one. Ten draw a coil of nichrome wire.
molten-duralumin=Aluminium with a tenth each of copper and magnesium. Ten cast a duralumin plate.
titanium-tetrachloride=Titanium stripped out of ilmenite by chlorine. Twenty and forty molten sodium make ten molten titanium.
molten-sodium=Sodium won from brine by a current, liquid at 120 degrees. It tears the chlorine off titanium tetrachloride.
molten-titanium=Titanium reduced by sodium and melted under the arcs. Eighty, an aluminium plate and a vanadium plate make a hundred titanium alloy.
molten-vanadium=Vanadium reduced out of magnetite. Ten cast a vanadium plate.
molten-titanium-alloy=Titanium with aluminium and vanadium. Ten cast a titanium alloy plate.
molten-superalloy=Nickel, chromium, cobalt, aluminium and yttrium melted together. Ten cast a superalloy plate.
nitrous-oxide=Made from ammonia and nitric acid. The oxidiser of a hybrid rocket motor: 20 to every rocket fuel.
krypton=A part in a million of the air. With fluorine it lases in the deep ultraviolet.
xenon=The rarest gas in the air. A ruby laser source's flash tube takes 20.
radon=Seeps out of uranium ore under water, ten from ten ore of which one is spent. Fifty decay into a hundred helium.
helium=The alpha particles of decaying radon with their electrons back. Nine parts to one of neon fill a helium-neon laser.
helium-neon=Helium with a tenth of neon. A helium-neon laser source takes 50.
excimer-gas=Krypton with a tenth of fluorine. A krypton fluoride laser source takes 50.
ozone=Three oxygen atoms in place of two. Cleans a wafer and leaves only oxygen behind: every processing unit takes 5.
propane=The larger part of petroleum gas. Two refine every ten lubricant.
ethane=The smaller part of petroleum gas. Cracked with steam it gives ethylene and hydrogen.
acetylene=Given off by calcium carbide in water. With hydrochloric acid, 30 make three plastic bars as PVC.

