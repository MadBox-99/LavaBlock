[recipe-description]
adobe-bricks-reinforced=Fibre in the mix holds the block together as it dries, so more of the batch survives.
quench-fluid=Pours the fluid into the lava under the island. Nothing comes back out.
crystal-growing=Each crystal rolls on its own: pyrite and olivine one craft in two, ruby and sapphire one in five, diamond one in twenty.
lime-concrete=Concrete bound with lime: 15 for the vanilla recipe's 10, and no iron ore or brick.
salt-melting=Fills a magma loop. The reactor and turbine pass the same salt back and forth, so this is only needed again when some of it is lost.
microchip=The laser source comes back out of 49 prints in 50.
sulfur-recovering=The Claus process: two parts hydrogen sulfide to one of sulfur dioxide. Volcanic gas carries the two equally, so half its sulfur dioxide is left over for sulfuric acid.
sulfur-concrete=Concrete bound with sulfur instead of cement. It takes no water.
advanced-circuit-etched=The board is etched instead of wired: one plastic bar instead of two, and copper plate instead of cable.
laser-source-neon=A tube of helium-neon lases in place of the ruby rod and its xenon flash tube. The crystal circuit board still carries a ruby of its own.
diamond-depositing=Chemical vapour deposition: the methane's carbon settles onto a seed as diamond.
float-glass=Molten glass poured onto a bath of molten tin: five glass from 100 where casting gets four. Nineteen of the twenty tin come back.
magnetite-precipitation=Three iron plates' worth of ferric chloride for a magnetite. The brine it leaves goes back to the cell, but makes less than half the caustic soda it took.
steel-arc-smelting=Ten iron and a coal for two steel in four seconds: four steel furnaces' worth from one building, for four times an electric furnace's power a plate.
alumina-leaching=Four of every five caustic soda come back out with the alumina.
nitric-acid-from-ammonia=The platinum gauze comes back 49 times in 50.
radon-emanation=Nine of the ten ore come back.
radon-decaying=A lead plate one craft in four, where the decay ends.
laser-source-excimer=A tube of krypton and fluorine lases in place of the ruby rod and its xenon flash tube. The crystal circuit board still carries a ruby of its own.
