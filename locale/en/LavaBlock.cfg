[technology-description]
bio-ethanol=Ferment straw or wood in a closed tank and boil the alcohol out of the wash in a distillation column. A liquid fuel grown rather than drilled.
synthetic-ethanol=Hydrate the ethylene in petroleum gas with steam. The same ethanol, with nothing grown for it.
ethanol-rocket-fuel=Alcohol against oxygen, the way the first liquid-fuelled rockets flew.
adobe-bricks=Wet the crushed rock, tread it, press it into moulds and leave it to dry. The same bricks the kiln makes, from the same gravel, with no furnace and no fuel - paid for in time and in somewhere to stack them.
fluid-quenching=A lined shaft down to the melt, and the plumbing to feed it. Anything you pipe into a Quench Pit goes into the lava and comes back as smoke.
chlorinated-purification=Scrub chlorine out of the gas the lava gives off, and feed it to the centrifuge. Chlorine carries the iron and sulphur away as chlorides instead of the centrifuge throwing away the melt they are suspended in, so a run keeps three quarters of what goes in rather than half.
shielded-crystallization=A gas combiner, argon out of the air, and the blend the hearth grows its best crystal under. Argon has been sitting in this world with nothing able to produce it; this is where it comes from and what it is for.
lava-crystallization=A hearth that grows crystal out of a pan of melt, and the glass that comes from remelting it. Every glasshouse on the island is walled with the panels this makes, so it comes before them.
refined-crystallization=Run the hearth on purified lava. Clean melt seeds far fewer grains, so the same pan grows five large crystals where raw lava gave two small ones.
basalt-casting=Quench lava into basalt in a chemical plant. On its own the rock is worth nothing; it is the first half of a stone supply that does not cost ore.
stone-crushing=A roll crusher, and the two passes that turn basalt into stone: break it to gravel, then grind the gravel down. Until now every stone cost an iron ore and a copper ore, which made expanding the island the most expensive thing on it. The crusher burns fuel, so it works before there is a power network.
brick-reclamation=Grind surplus stone brick back into stone. What to do with the brick that cryogenic lava cooling keeps handing back.
powered-rock-crushing=An electric roll crusher: twice the speed of the burner, and it takes modules.
lubricated-rock-crushing=The industrial roll crusher, and a grinding recipe that runs on lubricant for half again as much stone from the same gravel.
algae-cultivation=An algae tank, and the two strains it can raise without an air line: green on mineral-rich water, red on hot water. Blue needs air, so it waits for Nitrogen Fixation. Green algae also ferment in the bio-ethanol tank.
bio-garden=The press. Squeezes the algae harvest for what it grew on - green gives fibre, red gives carbonate - and scrubs pollution from the air while it runs.
oxygen-processing=Splitting water with a current, and the oxygen-lanced smelting recipes that put the oxygen to work.
nitrogen-fixation=Blue algae, which lives off air and turns it into nitrogen. Waits until you can actually make air.
arboretum=An enclosed glasshouse that grows timber from seed. Replaces the makeshift wood extraction the island started with, and supplies a stock of seeds to get the first crop going.
water-condenser=A dedicated condenser that recovers far more water from the same steam than a chemical plant can.
foundation-platform-disable=The foundation crafting method has been exhausted. You must find alternative ways to expand your island.
lava-block-add-landfill=Gives more landfill. 500 per science tier by default.
xp-lab=Unlocks the XP Lab for quest-based research using XP Science Packs.
crafting-mastery=Master the art of crafting for increased productivity.
smelting-mastery=Perfect your smelting techniques for better yields.
handcrafting-mastery=Practice makes perfect. Increases your character's hand-crafting speed.
mining-mastery=Hone your instincts for the dig. Increases your character's mining speed.
military-science-pack-2=Unlock advanced military research capabilities using cutting-edge weaponry and electromagnetic technology.
asteroid-productivity-simple=Increases the productivity of simple asteroid crushing operations.
asteroid-productivity-advanced=Increases the productivity of advanced asteroid crushing operations.
circuit-science-pack=Unlock the Circuit Science Pack for advanced electronics research.
circuit-crafting-productivity=Improves the productivity of electronic circuit manufacturing processes.
industrialised-chemical-plant=A faster chemical plant: double crafting speed, same chemistry recipes.
crystal-growing=Slag skimmed off standing lava, grown on the crystal hearth with sulfur and coal. Five crystals come out of it at random, and the roll crusher takes whatever you are not using.
magnetite-growing=Molten iron on the crystal hearth with slag stirred through it, grown out as magnetite. The one crystal made from metal.
crystal-circuit-board=A circuit laid on a sapphire board, with pyrite contacts and a ruby at its heart.
limestone-processing=Limestone made from slag - leached with water, set with carbon dioxide from burnt coal - then fired to quicklime, slaked, mixed into mortar and cast as concrete.
laser-cutting=A ruby laser over a cutting bed, focused through lenses cast from molten quartz. It slices silica into silicon wafers for a cheaper solar panel, and sapphire into substrate for processing units built on crystal.
magma-power=A reactor that burns magma cells to drive molten salt up into plasma, and fifteen-tile turbines, four to a reactor, that turn the plasma into 250 MW each and let the salt back down. The island's answer to fusion, and it eats crystal.
euv-lithography=A laser fired at droplets of tin turns each one to plasma, and the plasma's light prints microchips onto silicon wafers. The tin grows on the crystal hearth as cassiterite, out of slag and chlorine. The laser source wears out, about one every fifty prints.
ferromagnetism=Magnets pressed from magnetite, copper wound into coils, and magnetite held in oil as ferrofluid. From here on, electric engines, substations and steam turbines are built from them.
volcanic-gas-processing=Draw the gas off standing lava and split it in the oil refinery. Its two sulfur gases burn down to molten sulfur in the Claus process, or oxidise to sulfuric acid - sulfur, acid and concrete with no oil behind them.
chlor-alkali-process=Leach brine out of basalt with steam and split it with a current into chlorine, hydrogen and caustic soda. Hydrochloric acid dissolves iron into ferric chloride, which etches circuit boards and precipitates magnetite.
glass-melting=Flux silica crystal with quicklime and melt it in the refinery. Poured glass takes a crystal and a half where the furnace takes two, and the melt goes straight into glazed panels.
float-glass=Reduce cassiterite to molten tin, cast it into plate, and pour molten glass onto a bath of it. Glass cooled flat on tin needs no grinding, so less of it is lost.
oxygen-steelmaking=Blow oxygen through molten iron to burn the carbon out, and cast the steel straight to plate. No iron plates and no furnace in between.
silicon-refining=Reduce silica to liquid silicon with coal, and pull single-crystal boules out of it on the crystal hearth under argon. Three wafers to a crystal where the laser cutter gets two.
biogas=Digest straw and algae to methane, reform it with steam to hydrogen and carbon monoxide, and build the two back up into light oil in the Fuel Plant. Fuel grown rather than drilled, by a second road.
diamond-synthesis=Grow diamond on the crystal hearth from a little methane in a lot of hydrogen, a layer of atoms at a time. One every thirty seconds, every time.
nitric-acid=Sieve nitrogen out of compressed air and burn it with oxygen in an electric arc. Nitric and sulfuric acid together nitrate coal into three explosives where black powder makes two.
bio-plastics=Take the water back out of ethanol for ethylene, or crack it out of ethane, and make it into PVC with hydrochloric acid. Plastic from straw instead of oil.
gas-lasers=Separate neon out of the air, draw radon off uranium ore and hold it until it decays into helium, and blend the two into the fill of a helium-neon laser source. One ruby a source instead of two.
uranium-hexafluoride=Scrub hydrofluoric acid out of volcanic gas, fluorinate uranium ore into a gas with it, and enrich the gas in the lava centrifuge: 43% more U-235 an ore than the vanilla centrifuge.
tungsten-from-lava=Spin hot tungsten ore out of purified lava in the lava centrifuge, melt it, and cast it with molten iron. Tungsten plate without Vulcanus: 10000 purified lava makes 40 plates.
arc-smelting=An arc furnace: three graphite electrodes through a water-cooled roof, and arcs that melt what no fire can. Smelts steel here, and every alloy and electrically won metal after it.
sulfide-ores=Grow galena and sphalerite out of slag on the crystal hearth, smelt them to molten lead and zinc in the arc furnace, and cast them into plate. Every battery is now a lead-acid battery, built on a lead plate.
alloy-steels=Grow pentlandite and chromite on the crystal hearth, smelt nickel, chromium and manganese in the arc furnace, and make stainless steel, manganese steel and nichrome of them. Heat exchangers and nuclear reactors are now built of stainless steel, tanks of manganese steel, and electric furnaces are wound with nichrome.
copper-alloys=Drop zinc into molten copper for brass and tin for bronze, and tin into molten lead for solder, and cast them. Processing units are now soldered, cannon shells cased in brass, and express belts run on bronze.
light-metals=Leach alumina out of basalt with caustic soda and smelt it to aluminium, and win magnesium from brine, both by electricity in the arc furnace. Molten aluminium with copper and magnesium is duralumin, which low density structures are now built of.
boron-processing=Crystallise borax out of brine on the crystal hearth and reduce it to boron with magnesium in the arc furnace. Every nuclear reactor's control rods are now boron.
titanium-processing=Grow ilmenite, chlorinate it to titanium tetrachloride, and reduce that with molten sodium won from brine. Molten titanium with aluminium and vanadium is Ti-6Al-4V, which exoskeletons and Mk2 power armour are now built of.
rare-earth-processing=Throw monazite out of purified lava in the lava centrifuge and crack it in hydrochloric acid into cerium, neodymium, yttrium and phosphorus. Neodymium with iron, boron and nickel makes the strongest magnets there are. Quartz lenses are now polished with cerium, silicon wafers doped with phosphorus, and Mk2 power armour moves on neodymium magnets.
superalloys=Leach cobalt out of pentlandite and melt a nickel superalloy of nickel, chromium, cobalt, aluminium and yttrium. Thrusters are now built of it, so every space platform waits on it.
precious-metals=Refine copper by electrolysis and part the slime it leaves with nitric acid and aqua regia into silver, gold and platinum. The wafer solar panel now takes a silver plate, and every microchip print a gold one.
ammonia-synthesis=Press nitrogen and hydrogen into ammonia, burn it over platinum into nitric acid, and turn ammonia and nitric acid into nitrous oxide. Rocket fuel now burns in nitrous oxide in place of light oil.
fertilizer=Crystallise potash out of brine and take it up with ammonia and phosphorus into NPK fertiliser. A tree grown with a fertiliser gives 12 wood instead of 8, and a green algae tank 8 algae instead of 5.
noble-gases=Distil krypton and xenon out of liquid air in the oil refinery, with nitrogen off the top. Every ruby laser source is now pumped by a xenon flash tube.
excimer-lasers=Split hydrofluoric acid into fluorine and hydrogen, blend the fluorine with krypton, and build laser sources that lase in the blend - the deep-ultraviolet light most chips are printed with. One ruby a source instead of two.
ozone-generation=Run oxygen through a silent electric discharge into ozone. Processing units are now washed in ozone in place of sulfuric acid.
gas-fractionation=Distil petroleum gas into propane and ethane. Lubricant is now refined with propane, and Bio-plastics cracks the ethane into ethylene.
calcium-carbide=Fuse quicklime and coal into calcium carbide in the arc furnace, drop it in water for acetylene, and make PVC of the acetylene with hydrochloric acid. Plastic from lime and coal, with no oil.
hot-isostatic-pressing=A furnace inside a pressure vessel, charged with argon at a thousand atmospheres, that sinters tungsten carbide and cobalt into cemented carbide. The big mining drill's bits are made of it.
eddy-current-separation=A belt onto a drum with a magnet rotor spinning in it: the rotor throws copper, aluminium and brass clear of the belt and lets everything else drop. Out of ten scrap come two aluminium, a zinc, a brass, a lead and an e-waste, and the arc furnace smelts e-waste to copper and anode slime.
bioleaching=Open stirred tanks in which bacteria that live on sulfur eat the sulfide ore away from the metal. Nickel and cobalt from pentlandite, zinc from sphalerite, gold from pyrite and a little of everything from slag, with no furnace and no acid. The bacteria are grown on Gleba and last 20 minutes.
lithium-ion-cells=A cell line that coats NMC cathode out of lithium, nickel, manganese and cobalt, winds it with a graphite anode and fills the cans with electrolyte made in the cryogenic plant. The cells go into the MK3 personal battery, and stand in for lead-acid batteries in accumulators and robot frames.

