[item-description]
pug-mill=Mixes crushed rock with water and presses it into brick moulds. The bricks come out wet and dry on their own.
fermentation-tank=A closed, cooled vessel where biomass and water ferment into wash.
island-link-pole=Reaches 64 tiles, the longest wire there is, to carry power from island to island. Takes two wires only - one in, one out.
fuel-plant=Hydrates petroleum gas into ethanol, and charges ethanol with oxygen into rocket fuel.
distillation-column=Boils fermented wash with steam from the reboiler; ethanol leaves the top of the tower and water the bottom.
straw=Cut and dried grass, for mixing into adobe.
wet-adobe-brick=Dries into a stone brick in two minutes, wherever it is standing.
quench-pit=Destroys any fluid at 1200 per second - one pump's worth. Costs power and pollutes heavily while it runs.
air-filter=An electrostatic precipitator. Charges the tower against the air passing up through it, and the dust drops out. The air compressor used to do this as well as compressing and separating; now it only compresses and separates.
gas-combiner=Two receivers, a mixing drum and a blower. Meters two gases together in a fixed ratio and sends out the blend.
crystallizer=A hexagonal hearth holding a pan of melt just below the temperature rock freezes at, with a rabble turning slowly through it. Crystal grows on the shelf around the rim.
silica-crystal=Grown out of a melt over several seconds rather than frozen out of it in one. Remelt it fast and it cannot crystallise again: that is glass.
glass=Cast sheet. The island's only transparent material, and what every growing building here is walled with.
glazed-panel=A pane in a steel frame. Wall panel for the glasshouses - the arboretum, the algae tank and the bio garden's dome.
burner-roll-crusher=Two toothed rolls turning towards each other, with the rock going down the gap between them. Burns fuel, so it needs no power line - which is the point, because the island wants stone long before it has a grid.
roll-crusher=Two toothed rolls turning towards each other, with the rock going down the gap between them. Twice the burner's speed, and it takes modules.
industrial-roll-crusher=The heavy roll crusher. Faster again, four module slots, and a lubricant line that unlocks a recipe getting half again as much stone out of the same basalt.
basalt=Lava quenched into rock. Worth nothing until it is crushed.
basalt-gravel=Basalt off the first pass through a crusher. One more grind and it is stone.
crusher-roll=A toothed drum. Two of them facing each other are what a roll crusher crushes with.
culture-column=A glazed column with a steel frame. What algae is grown in, and what the tank is four of.
grow-lamp=A magenta tube under a reflector. Plants and algae grow under these, because there is no sun worth having here.
condenser-coil=A finned copper tube. Pulls the heat out of steam so it can fall back to water.
bio-garden=A glass dome over a thickener and a press. Squeezes the algae harvest for what it grew on - fibre, nitrogen or carbonate - and absorbs pollution while it runs, about as much as seventeen trees on an island that has none.
algae-tank=A sealed photobioreactor. Four culture columns behind glass, growing green, blue or red algae depending on what you feed the second pipe.
algae-green=Grown on water thick with dissolved rock. Builds fibre, which presses into usable timber.
algae-blue=Grown on water and air. Fixes nitrogen straight out of the atmosphere.
algae-red=Grown on water and steam. Lays down calcium carbonate as it grows.
arboretum=A 5x5 glasshouse under grow lamps and a rotating irrigation boom. Grows wood from tree seeds and water, and can make its own seeds from wood.
water-condenser=Air-cooled steam condenser. Turns steam back into water at 2 to 1, where a chemical plant manages barely a tenth of that.
industrialised-chemical-plant=A whole refinery on one 3x3 skid. Twice the crafting speed of a chemical plant, on the same chemistry recipes. Its sight glasses show the colour of whatever it is making.
uranium-bacteria=Bacteria that metabolizes bioflux into uranium ore. Spoils into uranium ore.
lava-mech-armor=A basic mech armor with minimal protection. Perfect for surviving the harsh lava environment.
xp-science-pack=Crystallized experience from crafting. Used in the XP Lab.
xp-lab=A specialized lab that only accepts XP Science Packs for quest research.
military-science-pack-2=Advanced military research pack utilizing cutting-edge weaponry and electromagnetic technology.
circuit-science-pack=Science pack focused on electronic circuit research and productivity improvements.
lava-slag=The dross skimmed off standing lava. Grown with sulfur and coal it gives crystal; leached with water it gives up its calcium.
pyrite=Iron sulfide, grown in cubes. The commonest crystal the hearth gives.
magnetite=Iron oxide, grown out of molten iron with slag stirred through it. Magnetic: it holds the melt in magma cells and the magma reactor, and turns the magma turbine's generator.
olivine=The green silicate most slag is made of. It takes the heat without melting, so it lines the magma reactor and magma cells; crush the surplus to gravel.
ruby=Corundum reddened by chromium. One craft in five grows one.
sapphire=Corundum coloured by iron and titanium. One craft in five grows one.
diamond=Carbon from the coal. One craft in twenty grows one. The laser cutter takes one to carry the heat off its ruby rod.
crystal-circuit-board=A circuit laid on sapphire, with pyrite contacts and a ruby at its heart. Drives the laser cutter, and carries the sapphire processing unit.
limestone=Made, not mined: calcium out of slag, set with carbon dioxide.
quicklime=Limestone fired until its carbon dioxide is gone. Add water.
slaked-lime=Quicklime after water, fallen to powder. The binder in lime mortar.
lime-mortar=Slaked lime and gravel, mixed in the pug mill. Cast into concrete.
quartz-lens=Cast from molten quartz. Fused quartz passes a laser's light without soaking it up and cracking, which glass does not.
silicon-wafer=A slice off a silica crystal. Solar cells are made of these.
sapphire-substrate=Sapphire cut into thin plates, for chips built on crystal rather than on silicon alone.
magma-cell=A magnetite coil holding a charge of melt in an olivine lining, with pyrite to light it. Magma reactor fuel: 40 GJ, forty seconds in a working reactor.
magma-reactor=Burns magma cells and draws 100 MW to drive cold molten salt up into plasma - 1000 MW of it, enough for four magma turbines, one on each plasma nozzle. Reactors built side by side run hotter.
magma-turbine=Fifteen tiles of turbine and generator. Turns magma plasma into 250 MW and hot molten salt, which has to be cooled before the reactor takes it back. Plasma only passes straight in from a reactor or another turbine, never through a pipe.

