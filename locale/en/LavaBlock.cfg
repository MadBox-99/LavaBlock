[recipe-description]
adobe-bricks-reinforced=Fibre in the mix holds the block together as it dries, so more of the batch survives.
quench-fluid=Pours the fluid into the lava under the island. Nothing comes back out.
crystal-growing=Each crystal rolls on its own: pyrite and olivine one craft in two, ruby and sapphire one in five, diamond one in twenty.
lime-concrete=Concrete bound with lime: 15 for the vanilla recipe's 10, and no iron ore or brick.
salt-melting=Fills a magma loop. The reactor and turbine pass the same salt back and forth, so this is only needed again when some of it is lost.
