[technology-description]
lava-crystallization=A hearth that grows crystal out of a pan of melt, and the glass that comes from remelting it. Every glasshouse on the island is walled with the panels this makes, so it comes before them.
refined-crystallization=Run the hearth on purified lava. Clean melt seeds far fewer grains, so the same pan grows five large crystals where raw lava gave two small ones.
basalt-casting=Quench lava into basalt in a chemical plant. On its own the rock is worth nothing; it is the first half of a stone supply that does not cost ore.
stone-crushing=A roll crusher, and the two passes that turn basalt into stone: break it to gravel, then grind the gravel down. Until now every stone cost an iron ore and a copper ore, which made expanding the island the most expensive thing on it. The crusher burns fuel, so it works before there is a power network.
brick-reclamation=Grind surplus stone brick back into stone. What to do with the brick that cryogenic lava cooling keeps handing back.
powered-rock-crushing=An electric roll crusher: twice the speed of the burner, and it takes modules.
lubricated-rock-crushing=The industrial roll crusher, and a grinding recipe that runs on lubricant for half again as much stone from the same gravel.
algae-cultivation=An algae tank, and the two strains it can raise without an air line: green on mineral-rich water, red on hot water. Blue needs air, so it waits for Nitrogen Fixation.
bio-garden=The press. Squeezes the algae harvest for what it grew on - green gives fibre, red gives carbonate - and scrubs pollution from the air while it runs.
oxygen-processing=Splitting water with a current, and the oxygen-lanced smelting recipes that put the oxygen to work.
nitrogen-fixation=Blue algae, which lives off air and turns it into nitrogen. Waits until you can actually make air.
arboretum=An enclosed glasshouse that grows timber from seed. Replaces the makeshift wood extraction the island started with, and supplies a stock of seeds to get the first crop going.
water-condenser=A dedicated condenser that recovers far more water from the same steam than a chemical plant can.
foundation-platform-disable=The foundation crafting method has been exhausted. You must find alternative ways to expand your island.
lava-block-add-landfill=Gives more landfill. 500 per science tier by default.
lava-modules=Unlocks the ability to craft modules using lava.
lava-efficiency-module=Craft efficiency modules using lava instead of standard materials.
lava-efficiency-module-2=Craft efficiency modules 2 using lava instead of standard materials.
lava-efficiency-module-3=Craft efficiency modules 3 using lava instead of standard materials.
lava-speed-module=Craft speed modules using lava instead of standard materials.
lava-speed-module-2=Craft speed modules 2 using lava instead of standard materials.
lava-speed-module-3=Craft speed modules 3 using lava instead of standard materials.
lava-flying-robot-frame=Craft flying robot frames using lava instead of steel plates.
xp-lab=Unlocks the XP Lab for quest-based research using XP Science Packs.
crafting-mastery=Master the art of crafting for increased productivity.
smelting-mastery=Perfect your smelting techniques for better yields.
handcrafting-mastery=Practice makes perfect. Increases your character's hand-crafting speed.
mining-mastery=Hone your instincts for the dig. Increases your character's mining speed.
military-science-pack-2=Unlock advanced military research capabilities using cutting-edge weaponry and electromagnetic technology.
asteroid-productivity-simple=Increases the productivity of simple asteroid crushing operations.
asteroid-productivity-advanced=Increases the productivity of advanced asteroid crushing operations.
circuit-science-pack=Unlock the Circuit Science Pack for advanced electronics research.
circuit-crafting-productivity=Improves the productivity of electronic circuit manufacturing processes.
industrialised-chemical-plant=A faster chemical plant: double crafting speed, same chemistry recipes.

